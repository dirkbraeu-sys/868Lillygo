[platformio]
default_envs = lilygo868_dauer

; ============================================================================
;  LilyGo 868-Empfaenger  ·  LilyGo/TTGO LoRa32 V2.1 (SX1276, 868 MHz), COM16
;  Empfaengt und listet 868-MHz-FSK-Sensoren (Ecowitt/Fine Offset/Bresser, z.B.
;  DNT-Zusatzsensor = WH31E, 868,35 MHz, alle 61 s) ueber rtl_433_ESP.
;  rtl_433_ESP kann pro Build nur OOK ODER FSK - die 868-MHz-Sensoren senden FSK.
;
;  Bauen/Flashen (das globale `pio` ist auf diesem Rechner defekt - penv nutzen):
;     C:\Users\info\.platformio\penv\Scripts\python.exe -m platformio run -t upload --upload-port COM16
;     (ohne -e gilt der Standard lilygo868_dauer; PYTHONIOENCODING=utf-8 PYTHONUTF8=1 setzen)
;  Umgebungen:
;     lilygo868_dauer     Dauerbetrieb (Standard)
;     lilygo868_diagnose  wie Dauerbetrieb + Heap-Trace/ALLOCFAIL-Ausgabe auf der Konsole
;     ota                 drahtlos flashen (nach dem ersten USB-Flash), gleiche Firmware
; ============================================================================

[env]
platform      = espressif32
board         = ttgo-lora32-v21
framework     = arduino
monitor_speed = 115200

; WLAN + Webserver + OTA brauchen mehr Flash als die Default-Partitionstabelle hergibt.
board_build.partitions = min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    olikraus/U8g2 @ ^2.35.19
    https://github.com/NorthernMan54/rtl_433_ESP.git
    knolleary/PubSubClient @ ^2.8

build_flags =
    -DRF_SX1276
    -DRF_MODULE_FREQUENCY=868.35
    -DRF_MODULE_RECEIVER_GPIO=32
    -DLOG_LEVEL=LOG_LEVEL_INFO
    -DRTL_DEBUG=0

[env:lilygo868_dauer]
; FSK + WLAN. MINIMUM_SIGNAL_LENGTH 5000 us haelt das FSK-Rauschen von der Dekodierung
; fern, RTL_433_REDUCE_STACK_USE verkleinert den Bitpuffer (spart ~5,5 KB RAM).
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DOOK_MODULATION=false
    -DMINIMUM_SIGNAL_LENGTH=5000
    -DRTL_433_REDUCE_STACK_USE
    -DCORE_DEBUG_LEVEL=0

[env:lilygo868_diagnose]
; Wie Dauerbetrieb, zusaetzlich Heap-Trace (erste 90 s) und Meldung fehlgeschlagener
; Speicheranfragen (ALLOCFAIL) - zum Eingrenzen von Speicherproblemen.
upload_speed = 921600
build_flags =
    ${env:lilygo868_dauer.build_flags}
    -DHEAPTRACE

[env:ota]
; Drahtlos flashen (erst nach dem ersten USB-Flash moeglich): pio run -e ota -t upload
; --auth muss zu OTA_PASSWORD in include/secrets.h passen. Gleiche Firmware wie Dauerbetrieb.
upload_protocol = espota
upload_port     = lilygo868.local
upload_flags    =
    --auth=DEIN_OTA_PASSWORT
    --timeout=30
build_flags =
    ${env:lilygo868_dauer.build_flags}
